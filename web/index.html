<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="My Doctor - Votre médecin plus proche de vous">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Permissions caméra / microphone pour la téléconsultation -->
  <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, display-capture=*">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Doctor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>My Doctor</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fond blanc épuré conforme à la maquette */
    body {
      background-color: #FFFFFF;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background-color: #FFFFFF;
      z-index: 999999;
      box-sizing: border-box;
      padding: 24px;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .loader-top-spacer {
      height: 10px;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo-img {
      width: 220px;
      max-width: 80vw;
      height: auto;
      object-fit: contain;
      display: block;
      margin-bottom: 48px;
    }

    /* Spinner rotatif à 12 pétales bleu azur #009EE2 */
    .petal-spinner {
      position: relative;
      width: 44px;
      height: 44px;
      margin-bottom: 18px;
    }

    .petal-spinner div {
      position: absolute;
      left: 20px;
      top: 3px;
      width: 4px;
      height: 11px;
      background: #009EE2;
      border-radius: 4px;
      transform-origin: 2px 19px;
      animation: petal-fade 1s linear infinite;
    }

    .petal-spinner div:nth-child(1)  { transform: rotate(0deg); animation-delay: -1s; }
    .petal-spinner div:nth-child(2)  { transform: rotate(30deg); animation-delay: -0.916s; }
    .petal-spinner div:nth-child(3)  { transform: rotate(60deg); animation-delay: -0.833s; }
    .petal-spinner div:nth-child(4)  { transform: rotate(90deg); animation-delay: -0.75s; }
    .petal-spinner div:nth-child(5)  { transform: rotate(120deg); animation-delay: -0.666s; }
    .petal-spinner div:nth-child(6)  { transform: rotate(150deg); animation-delay: -0.583s; }
    .petal-spinner div:nth-child(7)  { transform: rotate(180deg); animation-delay: -0.5s; }
    .petal-spinner div:nth-child(8)  { transform: rotate(210deg); animation-delay: -0.416s; }
    .petal-spinner div:nth-child(9)  { transform: rotate(240deg); animation-delay: -0.333s; }
    .petal-spinner div:nth-child(10) { transform: rotate(270deg); animation-delay: -0.25s; }
    .petal-spinner div:nth-child(11) { transform: rotate(300deg); animation-delay: -0.166s; }
    .petal-spinner div:nth-child(12) { transform: rotate(330deg); animation-delay: -0.083s; }

    @keyframes petal-fade {
      from { opacity: 1; }
      to { opacity: 0.15; }
    }

    .loading-text {
      font-size: 16px;
      font-weight: 500;
      color: #64748B;
      letter-spacing: 0.2px;
    }

    /* Ligne de rythme cardiaque (ECG) turquoise */
    .heartbeat-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }
  </style>
</head>

<body>
  <div id="loading-indicator">
    <div class="loader-top-spacer"></div>
    <div class="loader-content">
      <img class="logo-img" src="logo.png" alt="My Doctor Logo">
      <div class="petal-spinner">
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div>
      </div>
      <div class="loading-text">Chargement...</div>
    </div>
    <div class="heartbeat-container">
      <svg width="120" height="24" viewBox="0 0 120 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 12 H48 L52 15.5 L58 1.5 L63 22.5 L67 8.5 L71 12 H120" stroke="#00A896" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <script>
    var loaderDismissed = false;
    function hideLoader() {
      if (loaderDismissed) return;
      loaderDismissed = true;
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        setTimeout(function () {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        }, 350);
      }
    }

    // Le loader web s'efface en douceur dès que Flutter a rendu ses premiers pixels
    window.addEventListener('flutter-first-frame', hideLoader);

    // Fallback de sécurité si l'événement n'est pas supporté par le navigateur
    window.addEventListener('load', function () {
      setTimeout(hideLoader, 5000);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
