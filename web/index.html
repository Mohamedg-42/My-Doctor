<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="My Doctor - Votre médecin plus proche de vous">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Permissions caméra / microphone pour la téléconsultation -->
  <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, display-capture=*">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Doctor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>My Doctor</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fond blanc épuré conforme à la maquette */
    body {
      background-color: #FFFFFF;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background-color: #FFFFFF;
      z-index: 999999;
      box-sizing: border-box;
      padding: 24px;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .loader-top-spacer {
      height: 10px;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo-img {
      width: 220px;
      max-width: 80vw;
      height: auto;
      object-fit: contain;
      display: block;
      margin-bottom: 48px;
    }

    /* Barre de chargement animée en onde cardiaque (ECG) */
    .ecg-loader-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 22px;
    }

    .ecg-loader-svg {
      width: 220px;
      max-width: 80vw;
      height: 46px;
      overflow: visible;
    }

    .ecg-track {
      stroke: rgba(0, 168, 150, 0.20);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ecg-pulse {
      stroke: #00A896;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100 164;
      stroke-dashoffset: 264;
      animation: ecg-continuous 1.5s linear infinite;
      filter: drop-shadow(0 0 3px rgba(0, 168, 150, 0.65));
    }

    @keyframes ecg-continuous {
      0% {
        stroke-dashoffset: 264;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    .loading-text {
      font-size: 16px;
      font-weight: 500;
      color: #64748B;
      letter-spacing: 0.2px;
    }
  </style>
</head>

<body>
  <div id="loading-indicator">
    <div class="loader-top-spacer"></div>
    <div class="loader-content">
      <img class="logo-img" src="logo.png" alt="My Doctor Logo">
      <div class="ecg-loader-container">
        <svg class="ecg-loader-svg" width="220" height="46" viewBox="0 0 200 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path class="ecg-track" pathLength="264" d="M0 22 H78 L84 25 L94 4 L104 40 L112 14 L119 22 H200"/>
          <path class="ecg-pulse" pathLength="264" d="M0 22 H78 L84 25 L94 4 L104 40 L112 14 L119 22 H200"/>
        </svg>
      </div>
      <div class="loading-text">Chargement...</div>
    </div>
    <div class="loader-top-spacer"></div>
  </div>

  <script>
    var loaderDismissed = false;
    function hideLoader() {
      if (loaderDismissed) return;
      loaderDismissed = true;
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        setTimeout(function () {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        }, 300);
      }
    }

    // Accessible globalement par Flutter et flutter_bootstrap.js
    window.hideLoader = hideLoader;

    // Écoute de l'événement premier frame
    window.addEventListener('flutter-first-frame', hideLoader);
    window.addEventListener('flutter-initialized', hideLoader);

    // Fallback de sécurité rapide si l'environnement bloque les événements
    window.addEventListener('load', function () {
      setTimeout(hideLoader, 2500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
