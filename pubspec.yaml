name: allo_docteur
description: HELLO DOC - Votre médecin plus proche de vous
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State Management
  provider: 6.1.5+1

  # HTTP & API
  http: 1.5.0
  dio: ^5.7.0

  # Local Storage
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_rating_bar: ^4.0.1
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  timeago: ^3.7.0
  badges: ^3.1.2

  # Maps & Location
  google_maps_flutter: ^2.9.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  url_launcher: ^6.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # Firebase
  firebase_core: 3.6.0
  cloud_firestore: 5.4.3
  firebase_messaging: 15.1.3
  
  # WebRTC - Appels Audio/Vidéo
  agora_rtc_engine: ^6.3.2
  
  # Icons
  cupertino_icons: ^1.0.8
  flutter_lucide: ^1.39.0

  # Utils
  uuid: ^4.5.1
  crypto: ^3.0.6
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.1.3
  permission_handler: ^11.3.1
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  open_file: ^3.5.10
  qr_flutter: ^4.1.0

  # Pharmacie module
  pdf: ^3.11.1
  printing: ^5.13.2
  syncfusion_flutter_charts: ^27.1.48

  # Caméra & Vidéo
  camera: ^0.11.0+2
  flutter_sound: ^9.2.13
  record: ^5.1.2
  just_audio: ^0.10.0
  emoji_picker_flutter: ^4.4.0
  google_fonts: ^8.2.1
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
